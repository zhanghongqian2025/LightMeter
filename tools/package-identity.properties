# 打包身份 —— **跨端唯一真源**。
#
# 【为什么要有这张表】
#   打包身份就是「这个产物叫什么、是什么版本、从哪个类启动、装哪个 jar、
#   运行时带哪些模块、jvm 参数是什么」。
#   它以前在两个脚本里**各写一遍**：
#     · tools/package-macos.sh      （APP_NAME / APP_VERSION / MAIN_CLASS / JAR_NAME / MODULES）
#     · tools/package-windows.ps1    （$AppName / $AppVersion / $MainClass / $JarName / $Modules）
#   同一件事两处定义 → **必然漂移**，而且漂移了不会红：
#   把版本号改成 1.0.1 只改 bash 那一处 → macOS 侧打出来是 1.0.1，
#   Windows 侧还是 1.0.0，**没有任何东西会核对**。
#   （第 6 个事实 jvm.args 原来是**内联**在两边的命令行里，各两处。）
#   → 抽成这张表，两个脚本各读一次。
#
# 【格式】
#   java.util.Properties 格式：key=value（等号两边**不留空格**）。
#   为什么不留空格：shell 侧用 sed 读（`s/^key=//p`），
#   留了空格会连空格一起读进值里。
#   为什么不用 java.util.Properties 那边的「冒号也能当分隔符」：
#   那会让「值里含冒号」变 ambiguous，而这里没有这种需求。
#
# 【编码】
#   **UTF-8 无 BOM**（文件里有中文注释）。
#   为什么要「无 BOM」而不是「带 BOM」：
#     · bash 侧用 sed 读 → BOM 会粘在第一个键名上；
#     · PowerShell 5.1 侧用 `Get-Content -Encoding UTF8` **显式**读 → 无 BOM 也能正确解码中文。
#   块 25 那条「.ps1 必须带 UTF-8 BOM」的规矩针对的是 **PowerShell 要执行的脚本文件**
#   （5.1 按 ANSI 读无 BOM 的 .ps1 → 中文全乱码），
#   **数据文件**是另一回事：只要读的时候显式给编码，就没问题。
#   → 这里保持无 BOM + 显式 -Encoding UTF8，两边都稳。
#
# 【这三个值改了会怎样】
#   app.name     应用名 → .app 名 / .pkg 名 / .exe 名 / 卸载项名。
#   app.version  版本号 → 出现在包信息与安装界面里。
#   main.class   启动类 → 改错了打出来的包双击就报错（launcher 找不到）。
#   jar.name     fat jar 文件名 → 脚本要靠它找到刚打出来的 jar。
#   jlink.modules 运行时模块集 → **少任何一个的后果不是「功能少一点」，
#                 而是双击就报错**（jdeps 看不见静态初始化块，只认编译期可见的引用）。
#   jvm.args     传给 jpackage 的 jvm 参数 → 两边必须一致，
#                 否则「同一份产品」在两个平台上有不同的编码行为（中文会变乱码）。
#
# ---- jvm.args 为什么多了 stdout/stderr.encoding（2026-10-25 真机实测）----
#   file.encoding 管的是「读文件 / 字符串内部表示」，**管不到控制台输出**：
#   stdout/stderr 用的是各自的 stdout.encoding / stderr.encoding，
#   而它们在 Windows 上默认取**系统本地代码页**。
#   → 中文系统 = GBK(936)：UTF-8 的字节被当成 GBK 解释 → 满屏乱码；
#     其它 locale = cp1252/437：那套代码页**根本没有**「用法:」这几个字
#     → Java 只能替换成 '?'，用户看到的是「??:」。
#   两条路都指向同一个结论：输出编码必须**自己定**，不能交给系统默认。
#   → 两个平台都显式定成 UTF-8，「同一份产品」在两边的编码行为才真的相同。
#   （Windows 控制台怎么**显示**这些字节由 ConsoleEncoding 处理：双击那条路
#     会把**自己拉起来的**那个控制台切到 65001；不切只影响显示，不影响字节。）
# ---- --add-opens（2026-10-25 真机实测补上的）----
#   PDFBox 3.x 在初始化时要反射 **jdk.internal.ref.Cleaner**（为了把临时缓冲区
#   unmap 回内存）。JDK 9+ 的模块系统默认**不让** unnamed module 反射
#   那些内部类 → 抛 InaccessibleObjectException：
#     严重: Unmapping is not supported.
#     java.lang.reflect.InaccessibleObjectException: Unable to make public
#     jdk.internal.ref.Cleaner java.nio.DirectByteBuffer.cleaner() accessible
#   后果有两件，都不是「只是有点难看」：
#     ① 每次处理 PDF 都在控制台打一段异常栈 —— 用户会以为工具坏了；
#     ② unmap 失效 → 大 PDF 的内存占用降不下来。
#   → **两个包都要开**（本机实测：只开一个都还在报）：
#     `jdk.internal.ref`（Cleaner 类本身所在包）与 `java.nio`（cleaner() 的声明处）。
#     范围只到这两个包，不涉及 java.base 的其它内部类，也不影响任何安全边界。
#   **写法必须是 `--add-opens=包/目标` 这种单 token 形式**：
#     jpackage 把 java-options 逐行写进 .cfg、启动器**逐行**传给 JVM；
#     写成两段（`--add-opens` 一行、目标另一行）时两行配不上（本机实测：异常照旧）。
# ---- jlink 模块集：为什么是这六个（实测逼出来的，不是推理出来的）----
#   详见 docs/M3-4-阶段状态.md §三。简述：
#   java.base / java.xml / jdk.httpserver  本项目代码 jdeps 直接可见
#   java.logging                           ai.onnxruntime.OrtEnvironment.<clinit> → java.util.logging.Logger
#   java.desktop                           org.apache.pdfbox.filter.FilterFactory.<clinit> → DCTFilter
#                                          → javax.imageio.IIOException；而 COSStream.getFilterList()
#                                          是解析任何 PDF 1.5+ 必走的一步，绕不开
#   jdk.crypto.ec                          【2026-10-25 真 Windows 实测补上的】
#                                          Ed25519 的 KeyFactory 在 **jdk.crypto.ec**（sun.security.ec.ed）
#                                          里，**不在 java.base**。
#                                          少了它 → 装好的产品里 `KeyFactory.getInstance("Ed25519")`
#                                          抛 NoSuchAlgorithmException → **模型包一件都验不了签**
#                                          → `model install` 必然失败。
#                                          这条只有「真机装上、装模型、跑推理」才暴露得出来：
#                                          单测跑在完整 JDK 上永远是绿的。
#                                          守卫见 com.litemask.pack.RuntimeCapabilityProbe
#                                          （打包脚本会用**裁剪后的运行时**跑它，不过就停）。
#   未验证（Windows 侧）：win-x64 上这些模块的 .dll 体积与 ONNX Runtime 的原生库
#   是否随包带 Windows 版本 —— 那台机器上没有验过，脚本里写着「待验证」。
app.name=LightMeter
# 【2026-10-25 真实版本号从 1.0.0 提升到 1.1.1】
#
#   【为什么必须提升】
#     MSI 报 1638（"另一个版本的产品已安装"）的根因就是
#     **新旧两版的 ProductVersion 相同**：
#     jpackage 用「应用名 + 版本」推导 ProductCode，版本一样 → ProductCode 一样 →
#     Windows Installer 认为「这就是同一个产品，但版本没变」→ 拒绝覆盖安装。
#     → 「同版本不同构建」这种发包方式在 MSI 上**根本装不上**。
#     提升版本号是唯一正确的解法（UpgradeCode 不变，产品身份仍然是同一个）。
#
#   【为什么是 1.1.x 而不是 2.0.0】
#     这一版的实质变化是「模型随程序分发 + 界面自动准备模型」——
#     对普通用户来说，安装与使用的流程变了，但对已有用户来说
#     模型、设置、用户数据都保持不变（升级不删用户数据目录）。
#     → 次版本号。
#
#   【1.1.1 比 1.1.0 多了什么】
#     1.1.1 补上的是**升级时程序自己让位**（com.litemask.cli.InstallWatcher）：
#     程序在运行中时升级，Windows Installer 覆盖不了被打开的 jar；
#     而 Restart Manager 对「没有窗口的控制台程序」拒绝关闭 →
#     升级报 1304/1603，并把「结束进程」这件事推给用户。
#     → 1.1.1 起，程序自己看见「安装器来了」就交还资源并退出。
#     版本必须再提一次：否则 1.1.0 的 MSI 认不出「同版本不同构建」，又撞 1638。
#
#   【1.1.2 补的是什么】
#     1.1.1 的 InstallWatcher 有个**真缺陷**：主循环先 `await` 一小时才去 poll，
#     于是第一条事件要等一小时才被看见 —— 而安装器只重试 90 秒，等不到。
#     1.1.2 改成「带超时地 poll」，并补上第二个信号：
#     直接观察**有没有带本产品名的安装器进程在跑**
#     （目录监视依赖「安装器确实动了那个目录」，
#       而安装器在第一个文件就被占用时会直接失败，那时目录里一个字节都没变）。
#
#   【1.1.3 补的是什么】
#     1.1.3 修的是「换装被中断后不恢复」：
#     换装是两次改名，进程死在中间时生效目录会**短暂不存在**，
#     而原来那份还躺在历史目录里。那时候界面会说「未安装」——
#     **一句失实的话**（用户明明有一份能用的模型）。
#     1.1.3 起，启动时会把历史里那一版自动换回来。
#     另外补了两条回归测试（换装中断的恢复、装到一半失败时原版仍可用）。
#
#   【为什么版本号一路往上提，而不是反复重打同一个版本】
#     「同版本不同构建」在 MSI 上**根本装不上**（ProductCode 由「应用名 + 版本」推导，
#     版本一样 → ProductCode 一样 → Windows Installer 拒绝覆盖 → 1638）。
#     → 每一个**要发出去**的构建都必须有自己的版本号。
#     1.1.0 / 1.1.1 / 1.1.2 / 1.1.3 是为验收「升级链」依次打出来的中间件，
#     **只有 1.1.4 是发布件**。
app.version=1.1.4
main.class=com.litemask.cli.DesktopLauncher
jar.name=desens-core.jar
jlink.modules=java.base,java.xml,jdk.httpserver,java.logging,java.desktop,jdk.crypto.ec
jvm.args=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
# Windows 安装器的升级标识（UpgradeCode）。
# 【为什么必须是固定的】jpackage 不给 --win-upgrade-uuid 时会**每次构建随机生成**一个
#   UpgradeCode → 新版 MSI 认不出旧版 = 变成「并排安装」而不是「升级」，
#   用户机器上会同时存在两个 LightMeter（两个开始菜单项、两套服务）。
# 【它是什么】一个 UUID，与版本号无关：产品还是同一个产品，版本在 --app-version 里。
# 【变了会怎样】变了 = 换了另一个产品 = 旧版不会被自动替换掉，需手动卸载。
# 【为什么放这里】跨端唯一真源。两个打包脚本都读这张表，避免两处各写一份而漂移。
app.upgrade.uuid=50C1E772-D41D-4E8B-BCB1-725E0271E5A5
