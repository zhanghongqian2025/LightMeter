# 核心包体积闸门：预算与三层口径 —— **唯一真源**。
#
# 【为什么要有这张表】
#   体积是**唯一一个「涨了不会有人发现」的东西**：功能坏了会红、测试会挂、
#   用户会报错；体积涨了 3 MiB 时一切都正常，只是文档不再说得对。
#   而本项目每加一个依赖都会动它 → 闸门必须是**每次都跑的检查**，
#   不是文档里的一次性记录。
#
# 【为什么以前这张表只管半个平台 —— 2026-10-21 块 25 修掉的真缺陷】
#   闸门原来只存在于 tools/measure-size.sh（bash 脚本）。
#   Windows 构建机**不保证有 bash**，而 tools/package-windows.ps1
#   **从来没接上闸门** —— 它会打印体积，然后照样打「PASS 打包并验证通过」。
#   → 也就是说：**90 MiB 这条本项目唯一的硬指标，只在 macOS 侧生效**。
#     而 Windows 侧恰恰是更需要它的那边（那个脚本自己写着
#     「Windows 包省 6.57 MiB」——说明它知道体积会动，却没人拦着它动）。
#   → 现在判定逻辑搬到纯 JDK（com.litemask.pack.SizeGate），
#     两端读**同一份**这张表。
#
# 【规则怎么读】
#   budget.mib           预算是多少 **MiB**（1024^2 字节）
#   layer.<层>.name      那一层叫什么（表里打印用）
#   layer.<层>.required  这一层是不是**必需**
#                        （缺了 → 这次的合计**不成立** → 判失败，不是「按 0 算」）
#
# 【为什么用 MiB 而不是 MB】
#   「MB」在 Windows 资源管理器上是 1000^2，在 macOS 的 ls -lh 与 jlink 里是 1024^2。
#   统一用 MiB 比较更保守（数字更小），报给人看时 MiB 与 MB 两套都列出来，
#   免得「文档写 61MB、用户资源管理器显示 65MB」被当成造假。
#
# 【为什么不用 JSON / YAML】
#   判定器要能在 **Windows 构建机**上跑，而那台机器**不一定有 python**。
#   → 判定器用纯 JDK 写成，策略表用 java.util.Properties 读（零第三方依赖），
#     shell 侧用 grep/sed 读同一份（同一个事实只在一处定义）。
budget.mib=90

layer.L0.name=jlink 运行时
layer.L0.required=true

layer.L1.name=应用与核心依赖
layer.L1.required=true

layer.L2.name=NER 模型包
layer.L2.required=false
