# 交付平台与 ONNX Runtime 原生库的对应关系 —— **唯一真源**。
#
# 【为什么要有这张表】
#   ONNX Runtime 的 Maven 包**同时带 5 个平台**的原生库
#   （实测 onnxruntime-1.20.0.jar，92,987,839 B：
#     linux-aarch64 13.14 MiB / linux-x64 15.86 MiB / osx-aarch64 33.09 MiB
#     / osx-x64 36.33 MiB / win-x64 302.52 MiB，后者大半是 290MB 的 .pdb）。
#   每个交付平台的包**只该带自己那套**。
#
#   macOS 打包脚本会主动剔掉 win-x64（省 4.26 MiB），
#   Windows 打包脚本会主动剔掉 osx-*（省 6.57 MiB）——
#   但**两个脚本原来都不检查「自己那套还在不在**包里**」**。
#   → 上游依赖树一变（ORT 换版、或不再带 win-x64），
#     就会**静默**打出一个没有 ONNX 原生库的包 → 到用户机器上才炸（运行时才炸）。
#   → 这张表把「该有什么 / 不该有什么」写成**数据**，
#     两个打包脚本与链上的预检都读它（同一个事实只在一处定义）。
#
# 【规则怎么读】
#   native.prefix            原生库在 jar 里的目录前缀
#   always.forbidden         任何交付平台都不该带的平台目录（不交付的平台）
#   always.forbiddenSuffix   任何交付平台都不该带的文件后缀（调试符号）
#   platform.<平台>.required   该平台**必须**有的平台目录
#   platform.<平台>.forbidden  该平台**不该**有的平台目录（另一个交付平台的）
#
# 【为什么不用 JSON】
#   校验器要能在 **Windows 构建机**上跑，而那台机器**不一定有 python**。
#   → 校验器用纯 JDK 写成单文件程序，策略表用 java.util.Properties 读（零第三方依赖）。

native.prefix=ai/onnxruntime/native/

# 不交付的平台：白进包（linux 两套合计约 29 MiB 未压缩；osx-x64 是 Intel Mac）
always.forbidden=linux-aarch64,linux-x64,osx-x64

# 调试符号：dSYM 约 18.5 MiB；onnxruntime.pdb 单个就有 290 MB
always.forbiddenSuffix=.pdb,.dSYM

# macOS arm64：只带 osx-aarch64
platform.macos-arm64.required=osx-aarch64
platform.macos-arm64.forbidden=win-x64

# Windows x64：只带 win-x64
platform.windows-x64.required=win-x64
platform.windows-x64.forbidden=osx-aarch64
